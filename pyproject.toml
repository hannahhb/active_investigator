[project]
name = "active-investigator"
version = "0.1.0"
description = "Active investigator: follow-up questions grounded in execution traces, over PyINE records."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyine",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
active-investigator = "active_investigator.cli:main"

[tool.uv.sources]
pyine = { path = "../pyine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["active_investigator"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
